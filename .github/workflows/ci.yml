name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 bandit
        pip install -e .[dev]
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 blackbox_recorder tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 blackbox_recorder tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Security check with bandit
      run: |
        bandit -r blackbox_recorder -lll
        
    - name: Run E2E and Unit Tests
      run: |
        # Use our zero-dependency test runner
        python run_tests.py
        
    - name: Run Pytest (if available)
      run: |
        pytest tests/ -v
