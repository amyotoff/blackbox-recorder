name: Publish to PyPI

# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere.
# PyPI must have a publisher registered for this repository, pointing at this
# exact filename (publish.yml) and the `pypi` environment below.
#
# Fires automatically when a GitHub release is published. Use the manual
# trigger from `main` for the first publish, since a tag cut before this
# workflow existed cannot run it.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Refuse to publish a version that disagrees with the tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME} does not match project version ${version}"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai-blackbox-recorder
    permissions:
      id-token: write   # mints the OIDC token PyPI verifies; the only permission needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
